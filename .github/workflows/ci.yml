name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features
      - run: cargo test

  no_std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, thumbv7em-none-eabihf, thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
      - name: Rc build
        run: cargo build --no-default-features
      - name: Arc build without std
        run: cargo build --no-default-features --features sync
      - name: wasm32
        run: cargo check --target wasm32-unknown-unknown --no-default-features
      - name: Cortex-M4F (atomics, Arc)
        run: cargo check --target thumbv7em-none-eabihf --no-default-features --features sync
      - name: Cortex-M0 (no compare-and-swap, Rc)
        run: cargo check --target thumbv6m-none-eabi --no-default-features

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Benchmark suite compiles
        run: cargo check -p hooke-bench --all-targets

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      # Library only: dev-dependencies may need a newer toolchain.
      - run: cargo check --all-features
